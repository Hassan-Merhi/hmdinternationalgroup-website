services:
  - type: web
    name: samwatex
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: samwatex-website-db
          property: connectionString

databases:
  - name: samwatex-website-db
    plan: free
    databaseName: samwatex_website
    user: samwatex_website
