services:
  - type: web
    name: hmd-international-group
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hmd-website-db
          property: connectionString

databases:
  - name: hmd-website-db
    plan: free
    databaseName: hmd_website
    user: hmd_website
